# Team data for Sambhashana Research Group.
# Gravatar images are loaded automatically from the email address — no hash needed.
# Team members can register at https://gravatar.com using their BITS email to set a photo.
# If no Gravatar is registered, a default silhouette is shown.
#
# For student researchers:
#   batch:      year of joining BITS (e.g. 2023) — year of study is computed automatically
#   programme:  degree programme (e.g. "B.E. CS", "B.E. EIE")
#   roll:       BITS roll number (not displayed on website, kept for records)
#
# Project associations:
#   projects:   list of project slugs (filename stem of _projects/*.md, e.g. "bhram-il")
#   past:       flat form:  projects: [...] + period: "..." (or list for disjoint periods)
#               tuple form: stints: [{projects: [...], period: "..."}, ...] (different projects per period)

